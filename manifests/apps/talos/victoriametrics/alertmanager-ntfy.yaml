---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy
  labels:
    app: alertmanager-ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-ntfy
  template:
    metadata:
      labels:
        app: alertmanager-ntfy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: alertmanager-ntfy
          image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1
          args:
            - --configs
            - /etc/alertmanager-ntfy/config.yml,/etc/alertmanager-ntfy/auth/auth.yml
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager-ntfy/config.yml
              subPath: config.yml
              readOnly: true
            - name: auth
              mountPath: /etc/alertmanager-ntfy/auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alertmanager-ntfy-config
        - name: auth
          secret:
            secretName: alertmanager-ntfy-auth
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy
  labels:
    app: alertmanager-ntfy
spec:
  type: ClusterIP
  selector:
    app: alertmanager-ntfy
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# ntfy.sh has no access control on free-tier topics, so anything that can reach
# this service can push notifications to the phone. Only alertmanager needs to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ntfy
spec:
  podSelector:
    matchLabels:
      app: alertmanager-ntfy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalertmanager
      ports:
        - protocol: TCP
          port: 8000
