http:
  addr: :8000
ntfy:
  baseurl: https://ntfy.sh
  # ntfy.notification.topic and http.auth live in ntfy-secrets.sops.yaml.
  # On free ntfy.sh the topic name is the only thing protecting the feed
  # (ACL-protected "reserved topics" start at the paid Supporter tier), so it
  # is not kept in plaintext here. With a paid plan, add an access token as
  # ntfy.auth.token in that same secret and reserve the topic.
  notification:
    # https://docs.ntfy.sh/publish/#message-priority
    priority: |
      status == "resolved" ? "low" : (labels["severity"] == "critical" ? "high" : "default")
    tags:
      - tag: white_check_mark
        condition: status == "resolved"
      - tag: rotating_light
        condition: status == "firing" && labels["severity"] == "critical"
      - tag: warning
        condition: status == "firing" && labels["severity"] == "warning"
    templates:
      title: |
        {{ if eq .Status "resolved" }}Resolved: {{ end }}{{ index .Labels "alertname" }}{{ with index .Labels "namespace" }} ({{ . }}){{ end }}
      description: |
        {{ with index .Annotations "summary" }}{{ . }}
        {{ end }}{{ with index .Annotations "description" }}{{ . }}{{ end }}
      headers:
        X-Click: |
          {{ .GeneratorURL }}
  async: false
