apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: trivy-operator
spec:
  groups:
    - name: trivy-operator
      rules:
        # Aggregated per image: the raw series carry resource/container labels,
        # which would fire one alert per pod using the image. `sum by` also drops
        # Trivy's own `severity` label, which would clash with the alert's.
        #
        # keep_firing_for bridges the gap when a report is deleted and rescanned
        # (scannerReportTTL), which would otherwise resolve and re-fire the alert
        # every day.
        #
        # Only fires when a newer image actually drops a critical CVE: a fixed
        # package upstream is useless until the image is rebuilt. The count
        # comes from the trivy-update-check CronJob, pushed every 6h (hence
        # last_over_time); the `and` against the live Trivy series clears the
        # alert as soon as the image is no longer running.
        - alert: TrivyCriticalVulnerability
          expr: |
            max by (namespace, image_registry, image_repository, image_tag, update_tag) (
              last_over_time(trivy_image_update_fixed_vulnerabilities{severity="Critical"}[7h])
            ) > 0
            and on (namespace, image_registry, image_repository, image_tag)
            sum by (namespace, image_registry, image_repository, image_tag) (
              trivy_image_vulnerabilities{severity="Critical"}
            ) > 0
          for: 1h
          keep_firing_for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Updating {{ $labels.image_repository }}:{{ $labels.image_tag }} to {{ $labels.update_tag }} fixes {{ $value }} critical CVE(s)"
            description: "kubectl get vulnerabilityreports -n {{ $labels.namespace }} -o wide"
        - alert: TrivyExposedSecret
          expr: |
            sum by (namespace, image_registry, image_repository, image_tag) (
              trivy_image_exposedsecrets{severity=~"Critical|High"}
            ) > 0
          for: 1h
          keep_firing_for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} secret(s) baked into {{ $labels.image_repository }}:{{ $labels.image_tag }}"
            description: "kubectl get exposedsecretreports -n {{ $labels.namespace }} -o wide"
