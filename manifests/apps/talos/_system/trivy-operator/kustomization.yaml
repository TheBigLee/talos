apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Grafana (victoria-metrics-k8s-stack) only watches its own namespace for
# dashboard ConfigMaps, so the dashboard is shipped into victoriametrics
# rather than widening the sidecar's RBAC to every namespace.
# Source: https://grafana.com/grafana/dashboards/17813 (revision 2)
configMapGenerator:
  - name: trivy-operator-dashboard
    namespace: victoriametrics
    files:
      - trivy-operator-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
