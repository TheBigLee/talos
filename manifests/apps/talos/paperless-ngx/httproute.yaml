# Tailnet-only: attached to the "tailnet" listener, which is reachable only on
# the nodes' tailscale addresses. Public requests for this host get a 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik-system
    sectionName: tailnet
  hostnames:
  - paperless.bigli.io
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: paperless-ngx
      port: 8000
      weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /
