apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  sources:
    - path: "."
      repoURL: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
      targetRevision: 0.92.1
      helm:
        values: |
          grafana:
            image:
              # renovate: datasource=docker depName=docker.io/grafana/grafana
              tag: 12.3.0
            deploymentStrategy:
              type: Recreate
            envFromSecret: grafana-oidc
            env:
              GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
              GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana') && 'Admin'"
              GF_SERVER_DOMAIN: "grafana.bigli.io"
              GF_SERVER_ROOT_URL: "https://grafana.bigli.io"
              GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: 'true'
            persistence:
              enabled: true
              storageClassName: hcloud-volumes
              accessModes:
                  - ReadWriteOnce
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 640Mi
            sidecar:
              resources:
                requests:
                  cpu: 10m
                  memory: 48Mi
                limits:
                  memory: 128Mi
          alertmanager:
            spec:
              disableNamespaceMatcher: true
              # Mounted at /etc/vm/secrets/alertmanager-ntfy-auth, used for the
              # webhook basic_auth password below
              secrets:
                - alertmanager-ntfy-auth
            config:
              route:
                receiver: blackhole
                group_by: ["alertname", "namespace"]
                group_wait: 1m
                group_interval: 5m
                # personal cluster: no on-call, so re-notify slowly
                repeat_interval: 4h
                routes:
                  # Chatty-by-design rules that carry no actionable signal here
                  - receiver: blackhole
                    matchers:
                      - alertname=~"Watchdog|InfoInhibitor|CPUThrottlingHigh|KubeMemoryOvercommit|KubeCPUOvercommit"
                  - receiver: ntfy
                    matchers:
                      - severity=~"warning|critical"
              inhibit_rules:
                - source_matchers:
                    - severity=critical
                  target_matchers:
                    - severity=~"warning|info"
                  equal: ["alertname", "namespace"]
                - source_matchers:
                    - severity=warning
                  target_matchers:
                    - severity=info
                  equal: ["alertname", "namespace"]
                - source_matchers:
                    - alertname=InfoInhibitor
                  target_matchers:
                    - severity=info
                  equal: ["namespace"]
              receivers:
                - name: blackhole
                - name: ntfy
                  webhook_configs:
                    - url: http://alertmanager-ntfy:8000/hook
                      send_resolved: true
                      http_config:
                        basic_auth:
                          username: alertmanager
                          password_file: /etc/vm/secrets/alertmanager-ntfy-auth/webhook-password
          kubeEtcd:
            enabled: true
            service:
              enabled: true
              port: 2379
              targetPort: 2379
              selector:
                component: kube-controller-manager # instead of using hardcoded IP endpoints,
                # this is a trick borrowed from from https://github.com/siderolabs/talos/discussions/7214#discussioncomment-10255876
                # which only works if/because etcd is deployed on the same nodes where the rest
                # of the api server (notably kube-controller-manager) are deployed. Adjust if that's
                # not how your cluster is set up.
            # vmScrape here is synonymous with serviceMonitor in kube-prometheus
            vmScrape:
              spec:
                jobLabel: jobLabel
                namespaceSelector:
                  matchNames: [kube-system]
                endpoints:
                  - port: http-metrics
                    scheme: https
                    tlsConfig: # caFile, certFile, and keyFile from Neil's post
                      ca:
                        secret: # can reference the secret directly instead of needing
                                # to add it somewhere else
                          name: etcd-secrets
                          key: ca.crt
                      cert:
                        secret:
                          name: etcd-secrets
                          key: server.crt
                      keySecret:
                        name: etcd-secrets
                        key: server.key
          kubelet:
            vmScrape:
              spec:
                # Chart default only drops uid/id/name. The node labelmap below
                # it copies every node label onto every kubelet series, which
                # (a) inflates cardinality and (b) rides along into alert
                # labels - alertmanager-ntfy turns each alert label into an
                # ntfy tag, and ntfy rejects the whole notification with
                # HTTP 400 "tags are too large" past ~576 bytes of tags.
                # Keep this list in sync with the chart's defaults on upgrade.
                metricRelabelConfigs:
                  - action: labeldrop
                    regex: (uid)
                  - action: labeldrop
                    regex: (id|name)
                  - action: drop
                    source_labels: [__name__]
                    regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
                  - action: labeldrop
                    regex: (beta_)?kubernetes_io_.*|topology_kubernetes_io_.*|failure_domain_beta_kubernetes_io_.*|extensions_talos_dev_.*|csi_hetzner_cloud_.*
          kubeControllerManager:
            enabled: true
            service:
              enabled: true
            vmScrape:
              spec:
                jobLabel: jobLabel
                namespaceSelector:
                  matchNames:
                    - kube-system
                endpoints:
                  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                    # bearerTokenSecret:
                    #   key: ""
                    port: http-metrics
                    scheme: https
                    tlsConfig:
                      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      serverName: localhost
                      insecureSkipVerify: true

          kubeScheduler:
            enabled: true
            service:
              enabled: true
            vmScrape:
              spec:
                jobLabel: jobLabel
                namespaceSelector:
                  matchNames: [kube-system]
                endpoints:
                  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                    port: http-metrics
                    scheme: https
                    tlsConfig:
                      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      serverName: 127.0.0.1
                      insecureSkipVerify: true
          victoria-metrics-operator:
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 256Mi
          prometheus-node-exporter:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi
          kube-state-metrics:
            resources:
              requests:
                cpu: 25m
                memory: 48Mi
              limits:
                memory: 160Mi
          vmagent:
            spec:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 320Mi
          vmalert:
            spec:
              extraArgs:
                # Chart default leaves this at "http://", so alerts carry a
                # hostless GeneratorURL ("http:/explore?left=...") and the
                # tap-through link on the phone notification goes nowhere.
                external.url: https://grafana.bigli.io
          vmsingle:
            spec:
              resources:
                limits:
                  memory: 1200Mi
                requests:
                  memory: 128Mi
              retentionPeriod: "30d"
              removePvcAfterDelete: true
              extraArgs:
                maxLabelsPerTimeseries: "100"
    - path: manifests/apps/talos/victoriametrics
      repoURL: https://github.com/TheBigLee/talos.git
      targetRevision: HEAD
  destination:
    namespace: victoriametrics
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      # Chart 0.90.2 generates dashboards and rules from a sync Job instead of
      # rendering them statically as 0.79.1 did. Without prune, the 61 objects
      # the old chart left behind are tracked, never part of the desired state,
      # and never removed - so the app is permanently OutOfSync and resyncs
      # every ~3 minutes forever.
      prune: true
