apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
    - path: manifests/apps/talos/_system/cert-manager
      repoURL: https://github.com/TheBigLee/talos.git
      targetRevision: HEAD
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: v1.21.1
      helm:
        parameters:
          - name: crds.enabled
            value: "true"
        values: |
          config:
            apiVersion: controller.config.cert-manager.io/v1alpha1
            kind: ControllerConfiguration
            enableGatewayAPI: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          cainjector:
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                memory: 256Mi
          webhook:
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: apps
    kind: DaemonSet
    jqPathExpressions:
    - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
  project: system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: false
    automated:
      prune: true
