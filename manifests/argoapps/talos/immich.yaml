apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  sources:
    - chart: immich
      repoURL: ghcr.io/immich-app/immich-charts
      targetRevision: 0.13.4
      helm:
        values: |
          controllers:
            main:
              strategy: Recreate
              containers:
                main:
                  env:
                    DB_PASSWORD:
                      valueFrom:
                        secretKeyRef:
                          name: immich-postgres-user
                          key: password
                    DB_HOSTNAME: psql-pooler.postgresql.svc.cluster.local
                    DB_USERNAME:
                      valueFrom:
                        secretKeyRef:
                          name: immich-postgres-user
                          key: username
                    DB_DATABASE_NAME: immich
          immich:
            persistence:
              library:
                existingClaim: immich-data
          # Requests sized from observed steady-state RSS, limits from
          # observed peaks plus headroom. Without these all three ran as
          # BestEffort and were the first things Talos' OOM killer took.
          valkey:
            enabled: true
            controllers:
              main:
                containers:
                  main:
                    resources:
                      requests:
                        cpu: 25m
                        memory: 32Mi
                      limits:
                        memory: 128Mi
          server:
            enabled: true
            controllers:
              main:
                containers:
                  main:
                    image:
                      # renovate: image=ghcr.io/immich-app/immich-server
                      tag: v3.4.0@sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
                    resources:
                      requests:
                        cpu: 200m
                        memory: 1Gi
                      limits:
                        memory: 2560Mi
          machine-learning:
            controllers:
              main:
                containers:
                  main:
                    image:
                      # renovate: image=ghcr.io/immich-app/immich-machine-learning
                      tag: v3.4.0@sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
                    resources:
                      requests:
                        cpu: 100m
                        memory: 512Mi
                      limits:
                        memory: 2Gi
    - path: manifests/apps/talos/immich
      repoURL: https://github.com/TheBigLee/talos.git
      targetRevision: HEAD
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
