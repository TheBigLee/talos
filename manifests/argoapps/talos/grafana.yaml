apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  sources:
    - chart: grafana
      repoURL: https://grafana-community.github.io/helm-charts
      targetRevision: 14.3.0
      helm:
        values: |
          env:
            GF_AUTH_ANONYMOUS_ENABLED: true
            GF_SERVER_DOMAIN: graphs.bigli.io
            GF_SERVER_ROOT_URL: https://graphs.bigli.io
            GF_SECURITY_ALLOW_EMBEDDING: true
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            size: 1Gi
            storageClassName: hcloud-volumes
          rbac:
            namespaced: true
          admin:
            existingSecret: admin-creds
          sidecar:
            datasources:
              initDatasources: true
              enabled: true
              # Since chart 10.5 the init container runs with METHOD=WATCH and
              # never exits unless it is a native sidecar. The startup probe
              # keeps Grafana from starting before the first datasource sync.
              restartPolicy: Always
              startupProbe:
                httpGet:
                  path: /healthz
                  port: 8082
                initialDelaySeconds: 5
                periodSeconds: 5
                failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
    - path: manifests/apps/talos/grafana
      repoURL: https://github.com/TheBigLee/talos.git
      targetRevision: HEAD
  destination:
    namespace: grafana
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
