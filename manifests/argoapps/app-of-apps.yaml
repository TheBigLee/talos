apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests/argoapps
    repoURL: https://github.com/TheBigLee/talos.git
    targetRevision: HEAD
    directory:
      recurse: true
  syncPolicy:
    syncOptions:
      # Keep the pre-/post-delete finalizers Argo CD adds to child apps (see
      # ignoreDifferences in argocd-cm) instead of stripping them on sync.
      - RespectIgnoreDifferences=true
    automated:
      prune: true
