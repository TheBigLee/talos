# Talos v1.14 moved machine.install into UnattendedInstallConfig and
# machine.nodeLabels into KubeNodeConfig.labels. Keeping them in v1alpha1 is
# not merely deprecated - validation fails with "UnattendedInstallConfig config
# is incompatible with v1alpha1 config (.machine.install)".
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  topology.kubernetes.io/region: eu-central
  topology.kubernetes.io/zone: nbg1
