---
clusterName: talos-cluster
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.13.9
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4

endpoint: https://talos.bigli.io:6443

domain: cluster.local

allowSchedulingOnControlPlanes: true

cniConfig:
  name: none

# IPv4 pod and service networks
clusterPodNets:
  - 10.244.0.0/16 # IPv4
clusterSvcNets:
  - 10.96.0.0/12 # IPv4

additionalMachineCertSans:
  - 91.98.1.136
  - 2a01:4f8:1c1f:6001::1
  - talos.bigli.io

additionalApiServerCertSans:
  - 91.98.1.136
  - 2a01:4f8:1c1f:6001::1
  - talos.bigli.io

controlPlane:
  patches:
    # Disable default CNI and kube-proxy (Cilium replaces both)
    - |-
      cluster:
        network:
          cni:
            name: none
        proxy:
          disabled: true
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
          # Spread every workload across nodes by default. Without this the
          # scheduler only balances on requests with no anti-affinity pressure,
          # which let talos-cp2 reach 99% of allocatable while cp3 sat at 62%.
          #
          # ScheduleAnyway on purpose: this is a soft preference. The cluster
          # runs at ~77% requested, so a hard DoNotSchedule would strand pods
          # as Pending rather than merely place them badly.
          #
          # Affects new placements only - it prevents the imbalance recurring,
          # it does not unpack a node that is already full.
          config:
            apiVersion: kubescheduler.config.k8s.io/v1
            kind: KubeSchedulerConfiguration
            profiles:
              - schedulerName: default-scheduler
                pluginConfig:
                  - name: PodTopologySpread
                    args:
                      defaultingType: List
                      defaultConstraints:
                        - maxSkew: 1
                          topologyKey: kubernetes.io/hostname
                          whenUnsatisfiable: ScheduleAnyway
        etcd:
          advertisedSubnets:
            - 10.0.1.0/24
        apiServer:
          # The apiserver runs at ~1.5-1.7GiB steady with peaks to 2.8GiB,
          # against a Talos default request of 512Mi. The scheduler therefore
          # believed every control plane node had ~1.2GiB more room than it
          # did, and packed talos-cp2 to 93% of allocatable while the node was
          # really out of memory. The request is the number that fixes that.
          #
          # GOMEMLIMIT is a soft ceiling: the Go GC gets aggressive as the heap
          # approaches it instead of letting it grow to the peak and keeping
          # the pages. Deliberately no memory limit - a hard limit on the
          # apiserver trades a slow control plane for a dead one.
          resources:
            requests:
              cpu: 200m
              memory: 1500Mi
          env:
            GOMEMLIMIT: 1750MiB

    # Machine configuration
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            allowedKubernetesNamespaces:
              - system-upgrade
            allowedRoles:
              - os:admin
            enabled: true
        kubelet:
          nodeIP:
            validSubnets:
              - 10.0.1.0/24

  volumes:
    - name: STATE
      encryption:
        provider: luks2
        keys:
          - slot: 1
            nodeID: {}
    - name: EPHEMERAL
      encryption:
        provider: luks2
        keys:
          - slot: 1
            static:
              passphrase: ${DISK_ENCRYPTION_PASSPHRASE}
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/tailscale
  extensionServices:
    - name: tailscale
      environment:
        - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
        - TS_EXTRA_ARGS=--login-server=https://headscale.bigli.io

nodes:
  - hostname: talos-cp1
    controlPlane: true
    ipAddress: ${TALOS_CP1_IP}
    installDisk: /dev/sda
    nodeLabels:
      topology.kubernetes.io/region: eu-central
      topology.kubernetes.io/zone: nbg1
  - hostname: talos-cp2
    controlPlane: true
    ipAddress: ${TALOS_CP2_IP}
    installDisk: /dev/sda
    nodeLabels:
      topology.kubernetes.io/region: eu-central
      topology.kubernetes.io/zone: nbg1

  - hostname: talos-cp3
    controlPlane: true
    ipAddress: ${TALOS_CP3_IP}
    installDisk: /dev/sda
    nodeLabels:
      topology.kubernetes.io/region: eu-central
      topology.kubernetes.io/zone: nbg1
